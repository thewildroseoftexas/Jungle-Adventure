<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Escape from the Jungle</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101e16;color:#f7efd8;font-family:Georgia,serif}.wrap{max-width:1671px;margin:auto;padding:10px}
.controls,.inventory{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;margin:8px auto}
button{font:600 14px Georgia,serif;cursor:pointer} .controls button,.modal button,.inventory button{border:1px solid #e4d3a3;background:#e7d6aa;color:#233a23;border-radius:8px;padding:9px 12px}
button:focus-visible{outline:3px solid #ffdf78}.stage{position:relative;width:100%;aspect-ratio:1671/941;overflow:hidden;background:#102017}
.master{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.animal{position:absolute;object-fit:fill;opacity:0;pointer-events:none;transition:opacity .65s;filter:drop-shadow(0 1px 1px #0005)}
.animal.visible{opacity:1}.zone,.stone{position:absolute;background:transparent;border:0;padding:0;z-index:5}
.zone{border-radius:45%}.stone{width:5%;height:8%;border-radius:50%;z-index:6}
.showzones .zone{outline:2px dashed #fff3a0;background:#f9ed6420}.showzones .stone{outline:2px solid #7df0ff;background:#00ddff24}
.stone:disabled{pointer-events:none}.stone.active{filter:drop-shadow(0 0 7px #f6c95d)}
.gem{position:absolute;z-index:7;width:3.3%;aspect-ratio:1;transform:translate(-50%,-50%);border:0;background:transparent;padding:0;filter:drop-shadow(0 0 7px #ffef9a)}
.gem svg{width:100%;height:100%}.gem .gem-glint{animation:glint 3.8s ease-in-out infinite;transform:translateX(-110px)}@keyframes glint{0%,48%{transform:translateX(-110px)}65%,100%{transform:translateX(135px)}}.fly{position:absolute;z-index:10;width:7px;height:7px;border-radius:50%;background:#fff9a1;box-shadow:0 0 9px 4px #e8ff73;pointer-events:none;animation:twinkle 1.8s ease-in-out forwards}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3)}20%,55%,80%{opacity:1;transform:scale(1.4)}40%,70%{opacity:.2;transform:scale(.5)}}
.burst{position:absolute;z-index:11;width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 8px 3px #ffe19a;pointer-events:none;animation:burst .95s ease-out forwards}
@keyframes burst{from{opacity:1;transform:translate(0,0) scale(1.5)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2)}}
.inventory{background:#1c3025;border:1px solid #556d4d;border-radius:9px;padding:10px;min-height:62px}
.slot{display:flex;align-items:center;gap:6px;font-size:13px;padding:4px 8px;border:1px solid #53634d;border-radius:7px}
.slot svg{width:23px;height:23px}.muted{opacity:.4}.note{text-align:center;font-size:13px;color:#d1d8c6;margin:8px}
.overlay{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:30;padding:15px}.overlay.open{display:flex}
.modal{background:#263b2d;border:2px solid #c7ad73;border-radius:13px;padding:24px;max-width:480px;width:100%;text-align:center;box-shadow:0 8px 50px #000a}
.modal h2{margin-top:0}.modal p{font-size:18px;line-height:1.6;white-space:pre-line}.modal button{margin:6px}
#slots{display:flex;flex-direction:row;align-items:center;justify-content:center;flex-wrap:wrap;gap:5px}
.inventory{flex-direction:row;flex-wrap:wrap;gap:8px}
.wrap:fullscreen{max-width:none;width:100vw;height:100dvh;padding:5px;display:flex;flex-direction:column;align-items:center;background:#101e16;overflow:hidden}
.wrap:fullscreen .stage{flex:0 1 auto;width:min(100%,calc((100dvh - 130px) * 1671 / 941));height:auto;max-height:calc(100dvh - 130px);aspect-ratio:1671 / 941;min-height:0}
.wrap:fullscreen .master{object-fit:fill}
.wrap:fullscreen .inventory{flex:0 0 auto;width:100%;margin:3px auto;padding:5px;min-height:38px;flex-wrap:nowrap;gap:7px}
.wrap:fullscreen #slots{display:flex;flex-wrap:nowrap;gap:4px}
.wrap:fullscreen .slot{white-space:nowrap;padding:3px 5px;font-size:12px}
.wrap:fullscreen .slot svg{width:19px;height:19px}
.wrap:fullscreen .inventory button{padding:6px 8px;white-space:nowrap;font-size:12px}
.wrap:fullscreen .controls{flex:0 0 auto;margin:3px auto;gap:6px}
.wrap:fullscreen .note{display:none}
.wrap:fullscreen .overlay{position:fixed;inset:0;z-index:1000}
.wrap:fullscreen .modal{max-height:85dvh;overflow:auto}
@media(max-width:850px){.wrap:fullscreen .inventory{flex-wrap:wrap}.wrap:fullscreen #slots{flex-wrap:wrap}}
@media(max-width:650px){.wrap{padding:2px}.controls button{padding:7px;font-size:12px}.note{font-size:11px}.slot{font-size:11px}}

#pageTwo[hidden]{display:none!important}#pageTwo{width:100%;display:flex;flex-direction:column;align-items:center;min-height:0}
.temple-stage{position:relative;width:100%;aspect-ratio:1671/941;overflow:hidden;touch-action:none;user-select:none;background:#17291b}
.temple-bg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.temple-socket{position:absolute;width:4.5%;height:8.2%;transform:translate(-50%,-50%);border-radius:50%;border:0;background:transparent;pointer-events:none}
.temple-socket.filled{filter:drop-shadow(0 0 11px #ffdb82)}.temple-socket svg{width:100%;height:100%;filter:drop-shadow(0 0 8px #fff6ae)}
.ground-jewel{position:absolute;width:4.2%;height:8.2%;transform:translate(-50%,-50%);border:0;padding:0;background:transparent;cursor:grab;touch-action:none;z-index:8;filter:drop-shadow(0 3px 5px #000b)}
.ground-jewel svg{width:100%;height:100%;pointer-events:none}.ground-jewel.dragging{cursor:grabbing;z-index:15;filter:drop-shadow(0 0 14px #fff3a0)}
.ground-jewel.slipping{transition:left .5s cubic-bezier(.25,.7,.45,1.1),top .5s cubic-bezier(.2,.7,.3,1.4),transform .5s;transform:translate(-50%,-50%) rotate(24deg)}
#coordinates{position:absolute;left:22%;top:67%;width:56%;height:26%;text-align:center;color:#ffe6a4;text-shadow:0 0 9px #ffd26b,1px 2px 2px #38210c;font:700 clamp(11px,2.0vw,32px) Georgia,serif;letter-spacing:.025em;opacity:0;pointer-events:none;transition:opacity 2.2s}
#coordinates img{display:block;width:100%;height:100%;object-fit:fill;filter:drop-shadow(0 8px 7px #0009)}
#coordinates .inscription{position:absolute;left:14%;top:21%;width:72%;height:60%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2%;color:#32230e;text-shadow:1px 1px 1px #e3c78a,-1px -1px 1px #241708;font-weight:bold;line-height:1.3}
#coordinates .inscription span{white-space:nowrap}
#coordinates.revealed{opacity:1;animation:ancientglow 3s ease-in-out infinite alternate}@keyframes ancientglow{from{text-shadow:0 0 4px #cba14e}to{text-shadow:0 0 16px #fff5b0,0 0 26px #edb45a}}
.temple-controls{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;padding:8px;color:#f3e4c4}.temple-controls button{background:#e7d6aa;color:#233a23;border:0;border-radius:8px;padding:8px 12px;font:600 14px Georgia;cursor:pointer}
#veil{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:radial-gradient(circle,#6c603a 0%,#0b1e16 70%);color:#fff2b5;font:700 clamp(22px,4vw,50px) Georgia;text-align:center;pointer-events:none;opacity:0;transition:opacity .65s}
#veil.active{display:flex;opacity:1}#veil span{animation:ancientglow 1.3s infinite alternate}
#transitionFX{position:absolute;inset:0;pointer-events:none;z-index:12}.falling-gem{position:absolute;width:4%;height:8%;animation:gemfall 1.3s ease-in forwards;filter:drop-shadow(0 0 8px #ffec91)}.falling-gem svg{width:100%;height:100%}
@keyframes gemfall{0%{top:-20%;opacity:0;transform:rotate(-25deg)}20%{opacity:1}75%{top:75%;transform:rotate(55deg)}90%{top:68%;transform:rotate(85deg)}100%{top:86%;transform:rotate(115deg);opacity:0}}
.wrap:fullscreen #pageTwo{flex:1;min-height:0;justify-content:center}.wrap:fullscreen .temple-stage{width:min(100%,calc((100dvh - 110px)*1671/941));max-height:calc(100dvh - 110px);flex:0 1 auto}.wrap:fullscreen .temple-controls{flex:0 0 auto}
@media(max-width:650px){.temple-controls{font-size:12px}.temple-controls button{font-size:12px}#coordinates{font-size:clamp(10px,2.1vw,22px)}}
</style></head><body><main class="wrap" id="gameWrap">
<div class="controls"><button id="zones" hidden>Show Zones</button><button id="all" hidden>Reveal All</button><button id="reset">Reset Game</button><button id="full">Full Screen</button><span id="count">0 / 9 animals</span><span id="status">Find the hidden creatures in any order.</span></div>
<div id="stage" class="stage"><img class="master" src="rainforest_master.png" alt="Approved rainforest scene"></div>
<div class="inventory"><strong>Jewel collection:</strong><span id="slots"></span><button id="journal" disabled>Jungle Journal (locked)</button><button id="next" disabled>Awaken the Jungle</button></div>
<p class="note" id="firstNote">Follow the creatures’ clues to discover the engraved stones. Reveal and collect each jewel to awaken the jungle.</p>
<section id="pageTwo" hidden>
 <div class="temple-stage" id="templeStage"><img src="monument.png" class="temple-bg" alt="Ancient feline monument with five empty settings"><div id="templeSockets"></div><div id="groundJewels"></div><div id="coordinates" aria-live="polite"><img src="coordinate_stone.png" alt="Ancient engraved stone"><div class="inscription"><span></span><span></span></div></div><div id="transitionFX"></div></div>
 <div class="temple-controls"><span id="templeStatus">The jewels have slipped from your pocket. Drag them into the ancient settings.</span><button id="restartTemple">Scatter jewels again</button><button id="backJungle">Return to jungle</button></div>
 </section>
 <div id="veil"><span id="veilMessage">The jewels awaken...</span></div>
</main><div id="overlay" class="overlay" role="dialog" aria-modal="true"><div class="modal"><h2 id="modalTitle"></h2><p id="modalText"></p><button id="modalAction">Continue</button><button id="modalClose">Close</button></div></div>
<script>
/*
 Why search the code for secrets here,
 When jungle trails are waiting near?
 No buzzing pests, no bites to rue,
 A mosquito-free adventure waits for you!
*/
const animals=[{"id": "black_panther", "name": "Panther", "x": 12.2, "y": 33.5, "w": 15, "h": 22.5, "riddle": "Where shadows coil and secrets wind, four crimson points are yours to find. A turning trail without an end guards the treasure I defend.", "action": "spiral"}, {"id": "jaguar", "name": "Jaguar", "x": 70.0, "y": 32.5, "w": 12.6, "h": 18, "riddle": "The jungle's bones lie scattered wide, beneath the moss where secrets hide. Some rocks are smooth, some cracked, some old. Choose what you dare, if you are bold.", "action": "reset"}, {"id": "tropical_bird", "name": "Tropical bird", "x": 25.6, "y": 5, "w": 9, "h": 12, "riddle": "My painted wings through branches glide, where silent hunters often hide. Follow the tracks that leave no sound; a blue, unbroken curve is found.", "action": "paw"}, {"id": "howler_monkey", "name": "Howling monkey", "x": 75, "y": 0.5, "w": 11, "h": 26, "riddle": "I swing above your precious prize, with clever hands and watchful eyes. What once was yours may cease to be; the jungle keeps no guarantee.", "action": "steal"}, {"id": "rat", "name": "Rat", "x": 17.5, "y": 72.5, "w": 10, "h": 10, "riddle": "I scurry low where shadows creep, through tangled roots where secrets sleep. The spotted hunter knows my game; confusion is our shared acclaim.", "action": "none"}, {"id": "hummingbird", "name": "Hummingbird", "x": 44.5, "y": 17.3, "w": 10, "h": 12, "riddle": "A thousand blossoms call my name. Their sweetest hearts are all I claim. I sip the sunshine, never still, and leave the flowers upon the hill.", "action": "none"}, {"id": "anaconda", "name": "Anaconda", "x": 52, "y": 78, "w": 16, "h": 15, "riddle": "I wind through roots where ancients sleep, and guard what branches cannot keep. One golden sorrow, shaped to fall, awaits where wooden giants stand tall.", "action": "tree"}, {"id": "cassowary", "name": "Cassowary", "x": 82, "y": 42.2, "w": 17, "h": 29, "riddle": "I tread where emerald shadows lie, beneath the green and tangled sky. Seek the mark that once was growing, where three sharp corners point to knowing.", "action": "leaf"}, {"id": "giant_spider", "name": "Spider", "x": 18.25, "y": 81, "w": 11, "h": 12, "riddle": "When daylight dies, I weave my thread, beneath the stars above my head. Seek the daylight carved in night, where eight green edges catch the light.", "action": "sun"}];
const stones=[{"id":"spiral","name":"Spiral","jewel":"Ruby","color":"#d80834","shape":"diamond","x":16.0,"y":72.5},{"id":"sun","name":"Sun","jewel":"Emerald","color":"#04ae55","shape":"octagon","x":41.5,"y":62.2},{"id":"paw","name":"Paw","jewel":"Sapphire","color":"#0750da","shape":"oval","x":31.2,"y":76.7},{"id":"leaf","name":"Leaf","jewel":"Amethyst","color":"#8629d9","shape":"triangle","x":69.5,"y":80.0},{"id":"tree","name":"Tree","jewel":"Amber","color":"#e9a50a","shape":"teardrop","x":86,"y":92.2}];
const stage=document.getElementById('stage'), overlay=document.getElementById('overlay');
document.getElementById('gameWrap').appendChild(overlay); // Dialog remains inside fullscreen game container.
const $=id=>document.getElementById(id);
let revealed=new Set(),pending=new Set(),solved=new Set(),visibleGems=new Set(),collected=new Set(),generation=0,modalAction=null,journalUnlocked=false;
function jewelSvg(s){
 // Solid, individually faceted jewel artwork without repeated SVG gradient/clip IDs.
 // This prevents white outlines and missing fills when a jewel appears multiple times.
 const shapes={
  diamond:'<polygon points="45,3 86,49 45,97 4,49"/>',
  octagon:'<polygon points="24,7 66,7 84,25 84,75 66,93 24,93 6,75 6,25"/>',
  triangle:'<polygon points="45,5 87,92 3,92"/>',
  oval:'<ellipse cx="45" cy="50" rx="34" ry="45"/>',
  teardrop:'<path d="M45 3C36 25 12 46 12 65a33 33 0 0 0 66 0C78 46 54 25 45 3Z"/>'
 };
 const facets={
  diamond:'<path d="M45 3 24 49 45 97 66 49 45 3M4 49H86M24 49 45 30 66 49 45 68Z"/>',
  octagon:'<path d="M26 7 32 29 58 29 64 7M6 28 32 29 32 71 6 72M84 28 58 29 58 71 84 72M26 93 32 71 58 71 64 93M32 29 45 42 58 29M32 71 45 58 58 71M45 42V58"/>',
  oval:'<path d="M45 5 25 20 11 50 25 80 45 95 65 80 79 50 65 20 45 5M25 20 34 37 45 26 56 37 65 20M11 50 34 37 45 50 56 37 79 50M25 80 34 63 45 75 56 63 65 80M11 50 34 63 45 50 56 63 79 50"/>',
  triangle:'<path d="M45 5V66L3 92M45 66 87 92M23 47H67M23 47 45 66 67 47M3 92 45 78 87 92"/>',
  teardrop:'<path d="M45 3 34 40 45 95 56 40 45 3M34 40 14 60 45 75 76 60 56 40M14 60 30 82 45 95 60 82 76 60"/>'
 };
 return `<svg viewBox="0 0 90 100" aria-hidden="true" class="jewel-svg"><g fill="none" stroke="#5b330c" stroke-width="9" stroke-linejoin="round">${shapes[s.shape]}</g><g fill="none" stroke="#efc05a" stroke-width="6" stroke-linejoin="round">${shapes[s.shape]}</g><g fill="${s.color}" stroke="#fff0ad" stroke-width="1.6">${shapes[s.shape]}</g><g fill="none" stroke="#fff" stroke-opacity=".56" stroke-width="1.6">${facets[s.shape]}</g><path d="M24 31 31 18 40 13" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".75"/><path d="M56 78 64 69" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".65"/></svg>`;
}
function dialog(title,message,action=null){$('modalTitle').textContent=title;$('modalText').textContent=message;modalAction=action;closeAction=null;$('modalAction').style.display=action?'inline-block':'none';$('modalAction').textContent=action?.label||'Continue';overlay.classList.add('open')}
let closeAction=null;
function closeDialog(){overlay.classList.remove('open');const fn=closeAction;closeAction=null;modalAction=null;if(fn)fn()}
$('modalClose').onclick=closeDialog;
$('modalAction').onclick=()=>{const action=modalAction;closeAction=null;overlay.classList.remove('open');modalAction=null;if(action?.fn)action.fn()};
function sparkle(x,y,color,n=8){for(let i=0;i<n;i++){let e=document.createElement('i');e.className='burst';e.style.left=x+'%';e.style.top=y+'%';e.style.setProperty('--c',i%3?'#ffe49b':color);let angle=2*Math.PI*i/n;e.style.setProperty('--dx',Math.cos(angle)*36+'px');e.style.setProperty('--dy',Math.sin(angle)*36+'px');stage.appendChild(e);setTimeout(()=>e.remove(),1050)}}
function fireflies(a,done){const gen=generation;let x=a.x+a.w/2,y=a.y+a.h/2;for(let i=0;i<4;i++){let f=document.createElement('i');f.className='fly';f.style.left=(x+Math.cos(i*Math.PI/2)*a.w*.4)+'%';f.style.top=(y+Math.sin(i*Math.PI/2)*a.h*.45)+'%';f.style.animationDelay=(i*.12)+'s';stage.appendChild(f);setTimeout(()=>f.remove(),2200)}setTimeout(()=>{pending.delete(a.id);if(gen!==generation)return;revealed.add(a.id);render();if(revealed.size===9)dialog('The jungle awakens','All nine creatures have appeared. Their riddles can now be opened. Choose carefully!')},2050)}
const journalPoem=`Not every creature has told its tale,\nSome offer treasure, some betrayal.\nOne swings above with fingers sly,\nOne wears the night in a spotted disguise.\nWhen precious colors fill your hand,\nReturn to those who guard this land.\nBut trust is costly, choices deep,\nAnd not all treasures are yours to keep.`;
function animalClick(a){
 if(!revealed.has(a.id)){if(pending.has(a.id))return;pending.add(a.id);fireflies(a);return}
 if(revealed.size<9)return;
 if(a.action==='reset'&&collected.size>=3){dialog('The jaguar’s trap',a.riddle);closeAction=()=>{resetGame();dialog('The jungle begins again','The jaguar has scattered every discovery. Find all nine creatures again.')};return}
 if(a.action==='steal'&&collected.size>=2){dialog('The monkey’s invitation',a.riddle);closeAction=()=>{for(const id of collected)visibleGems.delete(id);collected.clear();render();dialog('The jewel thief strikes!','Your collected jewels are hidden again at their engraved stones. Find and click each stone to reveal its jewel once more.')};return}
 if(stones.some(st=>st.id===a.action)){
  dialog(a.name,a.riddle,{label:'Now go find the jewel',fn:()=>{solved.add(a.action);render();dialog('The search begins','Search the jungle for the engraved stone hinted at by this creature. Click the stone to reveal its hidden jewel.')}});
 }else dialog(a.name,a.riddle);
}
function stoneClick(st){
 if(revealed.size<9||!solved.has(st.id))return;
 if(collected.has(st.id)){dialog('Empty engraving','You already have this jewel.');return}
 if(!visibleGems.has(st.id)){
  visibleGems.add(st.id);render();
  dialog('A hidden jewel emerges','A jewel has appeared on the engraved stone. Click the jewel to collect it.');
 }
}
function collect(st){
 if(!visibleGems.has(st.id)||collected.has(st.id))return;
 sparkle(st.x,st.y,st.color);visibleGems.delete(st.id);collected.add(st.id);render();
 if(collected.size===2&&!journalUnlocked){journalUnlocked=true;$('journal').disabled=false;$('journal').textContent='Read Jungle Journal';dialog('A whisper in the jungle',journalPoem)}
 else if(collected.size===5)dialog('Five jewels collected!','All five jewels are in your inventory. Close this message, then click Awaken the Jungle to enter page two.');
}
function render(){
animals.forEach(a=>{$('animal-'+a.id).classList.toggle('visible',revealed.has(a.id))});
stones.forEach(s=>{let b=$('gem-'+s.id);b.style.display=visibleGems.has(s.id)&&!collected.has(s.id)?'block':'none'});
$('count').textContent=revealed.size+' / 9 animals · '+collected.size+' / 5 jewels collected';
$('status').textContent=revealed.size===9?'Beware..there are 2 animals not to be trusted':'Find the hidden creatures in any order.';
$('slots').innerHTML=stones.map(s=>`<span class="slot ${collected.has(s.id)?'':'muted'}">${jewelSvg(s)} ${s.jewel}${collected.has(s.id)?' ✓':''}</span>`).join('');
$('next').disabled=collected.size!==5;
$('next').title=collected.size===5?'Enter the ancient monument':'Collect all five jewels by clicking each revealed gemstone ('+collected.size+'/5 collected)';
$('journal').disabled=!journalUnlocked;
}
function resetGame(){templeActive=false;placed.clear();$('pageTwo').hidden=true;document.querySelector('.controls').style.display='';$('stage').style.display='';document.querySelector('.inventory').style.display='';$('firstNote').style.display='';generation++;revealed.clear();pending.clear();solved.clear();visibleGems.clear();collected.clear();journalUnlocked=false;$('journal').disabled=true;$('journal').textContent='Jungle Journal (locked)';stage.querySelectorAll('.fly,.burst').forEach(e=>e.remove());render()}
animals.forEach(a=>{let img=document.createElement('img');img.id='animal-'+a.id;img.className='animal';img.src=a.id+'.png';img.alt=a.name;Object.assign(img.style,{left:a.x+'%',top:a.y+'%',width:a.w+'%',height:a.h+'%'});stage.appendChild(img);let z=document.createElement('button');z.type='button';z.className='zone';z.title=a.name;z.setAttribute('aria-label','Find or speak with '+a.name);Object.assign(z.style,{left:a.x+'%',top:a.y+'%',width:a.w+'%',height:a.h+'%'});z.onclick=()=>animalClick(a);stage.appendChild(z)});
stones.forEach(st=>{
 let z=document.createElement('button');z.className='stone';z.title=st.name+' engraved stone';z.setAttribute('aria-label',st.name+' engraved stone');
 z.style.left=(st.id==='paw'?34.0:st.x-3)+'%';z.style.top=(st.id==='paw'?76.0:st.y-5)+'%';z.style.width=(st.id==='paw'?'10%':'6%');z.style.height=(st.id==='paw'?'12%':'10%');z.style.zIndex=st.id==='paw'?'9':'6';
 z.onclick=()=>stoneClick(st);stage.appendChild(z);
 let g=document.createElement('button');g.id='gem-'+st.id;g.className='gem';g.title='Collect '+st.jewel;g.setAttribute('aria-label','Collect '+st.jewel);
 g.style.left=st.x+'%';g.style.top=st.y+'%';g.innerHTML=jewelSvg(st);g.onclick=()=>collect(st);stage.appendChild(g)
});
$('journal').onclick=()=>{if(journalUnlocked)dialog('Jungle Journal',journalPoem)}; $('reset').onclick=resetGame;$('zones').onclick=()=>{stage.classList.toggle('showzones');$('zones').textContent=stage.classList.contains('showzones')?'Hide Zones':'Show Zones'};
$('all').onclick=()=>{generation++;pending.clear();revealed=new Set(animals.map(a=>a.id));stage.querySelectorAll('.fly').forEach(e=>e.remove());render()};
$('full').onclick=()=>{if(!document.fullscreenElement)$('gameWrap').requestFullscreen?.();else document.exitFullscreen?.()};
$('next').onclick=()=>{if(collected.size===5)startTransition();else dialog('Collect the jewels first','Reveal each jewel on its engraved stone, then click the gemstone to place it in your inventory. You have '+collected.size+' of 5 jewels collected.')};

// Second scene: monument jewel puzzle. Exact sockets follow the five circular engravings.
const monumentSlots=[{id:'tree',x:39.35,y:47.5},{id:'paw',x:44.15,y:47.5},{id:'leaf',x:48.95,y:47.5},{id:'sun',x:53.7,y:47.5},{id:'spiral',x:58.5,y:47.5}];
let placed=new Set(),groundPositions={},dragging=null,templeActive=false;
const initialGround=[{x:30.2,y:86},{x:69.3,y:88},{x:57.8,y:84.5},{x:41.5,y:91},{x:80.3,y:85}];
function makeTemple(){
 const sockets=$('templeSockets'),ground=$('groundJewels');sockets.innerHTML='';ground.innerHTML='';
 monumentSlots.forEach((s,i)=>{let e=document.createElement('div');e.className='temple-socket';e.id='socket-'+s.id;e.style.left=s.x+'%';e.style.top=s.y+'%';e.setAttribute('aria-label','Monument setting '+(i+1));sockets.appendChild(e)});
 // The initial scatter has no relationship to the required left-to-right order.
 const randomOrder=[stones[3],stones[0],stones[4],stones[1],stones[2]];
 randomOrder.forEach((s,i)=>{let pt=initialGround[i];groundPositions[s.id]={...pt};let e=document.createElement('button');e.className='ground-jewel';e.id='ground-'+s.id;e.title='Drag '+s.jewel;e.setAttribute('aria-label','Drag '+s.jewel+' to a monument setting');e.innerHTML=jewelSvg(s);e.style.left=pt.x+'%';e.style.top=pt.y+'%';e.addEventListener('pointerdown',ev=>beginDrag(ev,s.id));ground.appendChild(e)});
 placed.clear();$('coordinates').classList.remove('revealed');$('templeStatus').textContent='Five jewels have fallen from your pocket. Drag each into its proper ancient setting.';
}
function beginDrag(ev,id){if(placed.has(id))return;ev.preventDefault();let el=$('ground-'+id);el.classList.remove('slipping');el.classList.add('dragging');el.setPointerCapture(ev.pointerId);dragging={id,el,pointerId:ev.pointerId};el.addEventListener('pointermove',moveDrag);el.addEventListener('pointerup',endDrag,{once:true});el.addEventListener('pointercancel',cancelDrag,{once:true})}
function pointerPercent(ev){const r=$('templeStage').getBoundingClientRect();return{x:(ev.clientX-r.left)/r.width*100,y:(ev.clientY-r.top)/r.height*100}}
function moveDrag(ev){if(!dragging||dragging.pointerId!==ev.pointerId)return;let p=pointerPercent(ev);dragging.el.style.left=Math.max(2,Math.min(98,p.x))+'%';dragging.el.style.top=Math.max(4,Math.min(96,p.y))+'%'}
function cancelDrag(){if(!dragging)return;let d=dragging;dragging=null;d.el.removeEventListener('pointermove',moveDrag);slipToGround(d.id,d.el)}
function endDrag(ev){if(!dragging)return;let d=dragging;dragging=null;d.el.removeEventListener('pointermove',moveDrag);let p=pointerPercent(ev);let target=monumentSlots.map(s=>({...s,distance:Math.hypot((p.x-s.x)/1.0,(p.y-s.y)/1.4)})).sort((a,b)=>a.distance-b.distance)[0];if(!target||target.distance>3.15)target=null;if(target&&target.id===d.id&&!placed.has(d.id)){lockJewel(d.id,d.el,target)}else{slipToGround(d.id,d.el);if(target)$('templeStatus').textContent='The jewel slips from your grasp and falls back to the mossy ground.'}}
function slipToGround(id,el){let p=groundPositions[id];el.classList.add('slipping');requestAnimationFrame(()=>{el.style.left=p.x+'%';el.style.top=p.y+'%'});setTimeout(()=>el.classList.remove('slipping'),550)}
function lockJewel(id,el,slot){placed.add(id);el.remove();let s=stones.find(s=>s.id===id);let e=$('socket-'+id);e.classList.add('filled');e.innerHTML=jewelSvg(s);templeSparkle(slot.x,slot.y,s.color);$('templeStatus').textContent=placed.size+' of 5 jewels restored to the monument.';if(placed.size===5)setTimeout(revealCoordinates,850)}
function templeSparkle(x,y,color){for(let i=0;i<10;i++){let b=document.createElement('i');b.className='burst';b.style.left=x+'%';b.style.top=y+'%';b.style.setProperty('--c',i%3?color:'#fff0ae');let a=i*Math.PI/5;b.style.setProperty('--dx',Math.cos(a)*40+'px');b.style.setProperty('--dy',Math.sin(a)*40+'px');$('templeStage').appendChild(b);setTimeout(()=>b.remove(),1050)}}
function revealCoordinates(){if(placed.size!==5)return;const code=[78,32,50,57,176,32,51,54,46,50,48,53,10,87,32,48,57,56,176,32,50,53,46,50,55,53];$('coordinates').querySelectorAll('.inscription span').forEach((e,i)=>e.textContent=String.fromCharCode(...(i===0?code.slice(0,13):code.slice(13))));$('coordinates').classList.add('revealed');$('templeStatus').textContent='The ancient coordinates have awakened!'}
function startTransition(){if(collected.size!==5)return;templeActive=true;const veil=$('veil');veil.classList.add('active');$('veilMessage').textContent='Five treasures stir beneath the jungle...';setTimeout(()=>{document.querySelector('.controls').style.display='none';$('stage').style.display='none';document.querySelector('.inventory').style.display='none';$('firstNote').style.display='none';$('pageTwo').hidden=false;makeTemple();$('veilMessage').textContent='A hole in the pocket! The jewels tumble free...';},800);setTimeout(()=>{veil.classList.remove('active');for(let i=0;i<5;i++){let s=stones[i];let f=document.createElement('div');f.className='falling-gem';f.style.left=(30+i*11)+'%';f.style.animationDelay=(i*.12)+'s';f.innerHTML=jewelSvg(s);$('transitionFX').appendChild(f);setTimeout(()=>f.remove(),2200)}},1550)}
$('restartTemple').onclick=()=>makeTemple();
$('backJungle').onclick=()=>{templeActive=false;$('pageTwo').hidden=true;document.querySelector('.controls').style.display='';$('stage').style.display='';document.querySelector('.inventory').style.display='';$('firstNote').style.display='';};

render();
</script></body></html>
